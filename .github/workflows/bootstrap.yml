name: Bootstrap FairShare

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap.yml'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct source tree
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/chunk* | base64 --decode > /tmp/fairshare-src.tar.gz
          tar -xzf /tmp/fairshare-src.tar.gz -C .
          rm -rf .bootstrap .github/workflows/bootstrap.yml
          git config user.name "FairShare Bootstrap"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat: bootstrap FairShare universal expense platform"
          git push origin HEAD:main
